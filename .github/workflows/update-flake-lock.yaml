---
name: Update flake.lock

# Dependabot doesn't cover Nix: refresh the pinned nixpkgs monthly via a PR.
# Needs "Allow GitHub Actions to create and approve pull requests" in the
# repository settings (Actions → General).
'on':
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702  # v31.11.2
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3  # v29
        with:
          pr-title: "Update flake.lock"
          pr-labels: dependencies
